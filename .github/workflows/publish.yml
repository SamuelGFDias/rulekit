name: Publish

# Publica RuleKit.Analyzer e RuleKit.Cli no nuget.org quando uma tag `v*` é enviada, e cria a
# GitHub Release com os pacotes anexados. A tag precisa apontar para um commit que já está na main.
#
# Dois jobs, de propósito, para o token OIDC nunca conviver com código do repositório:
#   - `build`   (contents: read)            — checkout, build, testes e pack; entrega só os pacotes.
#   - `publish` (id-token + contents: write) — NÃO faz checkout nem restore/build: baixa os pacotes
#     do job anterior, troca o OIDC por uma chave do nuget.org, empurra e cria/atualiza a Release.
# Assim, nenhum script, target MSBuild ou dependência do repositório roda com `id-token: write`.
#
# Trusted Publishing (OIDC): a policy no nuget.org está cadastrada para o repositório
# SamuelGFDias/rulekit, workflow `publish.yml`, SEM environment — por isso nenhum job declara
# `environment:` (declarar um faria o login falhar). O arquivo precisa continuar se chamando
# `publish.yml`. Nenhum secret é guardado no repositório.
#
# A versão vem do MinVer a partir da própria tag (v1.2.3 -> 1.2.3), por isso `fetch-depth: 0`.

on:
  push:
    tags: ['v*']

# Menor privilégio por padrão; o job `publish` eleva o seu.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  build:
    name: Build, testes e pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verificar que a tag está na main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::A tag $GITHUB_REF_NAME não aponta para um commit da main."
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # O RuleKit.Cli é multi-target (net8.0;net10.0): o SDK 10 baixa o targeting pack do net8.0 do
      # nuget.org durante o restore, então não é preciso instalar o SDK 8.
      - name: Restore
        run: dotnet restore RuleKit.sln

      - name: Build (Release)
        run: dotnet build RuleKit.sln -c Release --no-restore

      - name: Testes
        run: dotnet test RuleKit.sln -c Release --no-build

      # --no-build: o ILRepack (build/ilrepack.targets) roda só no pack, sobre o build Release acima.
      - name: Pack RuleKit.Analyzer e RuleKit.Cli
        run: |
          dotnet pack src/Arch.Analyzer -c Release --no-build -o artifacts
          dotnet pack src/Arch.Cli -c Release --no-build -o artifacts
          ls -l artifacts

      # O MinVer deriva a versão da tag; se o nome do pacote divergir da tag, algo está errado
      # (tag fora do padrão v<major>.<minor>.<patch>, ou checkout sem as tags).
      - name: Conferir que a versão dos pacotes é a da tag
        run: |
          ver="${GITHUB_REF_NAME#v}"
          for f in "artifacts/RuleKit.Analyzer.$ver.nupkg" "artifacts/RuleKit.Cli.$ver.nupkg" "artifacts/RuleKit.Cli.$ver.snupkg"; do
            if [ ! -f "$f" ]; then
              echo "::error::Esperava $f (versão da tag $GITHUB_REF_NAME), mas ele não foi gerado."
              ls -l artifacts
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  publish:
    name: Publicar no nuget.org e na Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write   # OIDC para o NuGet/login (Trusted Publishing)
      contents: write   # criar/atualizar a GitHub Release
    steps:
      # Sem checkout de propósito: este job só manuseia os pacotes já construídos.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: artifacts

      - name: Listar os pacotes a publicar
        run: ls -l artifacts

      # Troca o token OIDC do GitHub por uma chave de curta duração no nuget.org.
      - name: Login no NuGet (Trusted Publishing)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: samueldias21

      # `*.nupkg` empurra os dois pacotes; o .snupkg do RuleKit.Cli, que está na mesma pasta com o
      # mesmo nome, vai junto automaticamente (o nuget.org anuncia SymbolPackagePublish no
      # index.json). --skip-duplicate torna a reexecução do workflow idempotente.
      - name: Publicar no nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::O login do Trusted Publishing não devolveu a chave."
            exit 1
          fi
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source "$NUGET_SOURCE" \
            --skip-duplicate

      # Idempotente: se a Release da tag já existe (reexecução do workflow), só reenvia os pacotes
      # (--clobber) em vez de falhar no `create`. Sem checkout não há repositório git local, então o
      # `gh` recebe --repo explicitamente.
      - name: Criar ou atualizar a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          # Tag com sufixo (v1.0.0-rc.1) é pré-lançamento.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi

          if view_output=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" 2>&1); then
            echo "Release $GITHUB_REF_NAME já existe; atualizando os pacotes anexados."
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
          elif grep -qi "release not found" <<<"$view_output"; then
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${flags[@]}"
          else
            echo "::error::Não foi possível consultar a Release $GITHUB_REF_NAME: $view_output"
            exit 1
          fi
